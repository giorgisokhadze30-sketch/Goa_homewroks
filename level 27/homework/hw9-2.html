<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link rel="stylesheet" href="./style7.css">
</head>
<body>
    <div class="registration-box">
        <h2>Event Registration</h2>
        <p class="text-p">Register with us to get more details.</p>
        
        <form>
            <div class="form-item">
                <label>Name</label>
                <div class="name-inputs">
                    <input type="text" id="firstname" placeholder="First" required>
                    <input type="text" id="lastname" placeholder="Last" required>
                </div>
            </div>

            <div class="form-item">
                <label for="usermail">Email</label>
                <input type="email" id="useremail" required>
            </div>

            <div class="form-item">
                <label for="userphone">Phone</label>
                <input type="tel" id="userphone" required>
            </div>

            <div class="form-item">
                <label for="topic-input">Topic</label>
                <input type="text" id="topic-input" placeholder="Choose Topic" required>
            </div>

            <div class="form-item">
                <label for="slot-input">Preferred Slot</label>
                <input type="text" id="slot-input" placeholder="Choose Slot" required>
            </div>

            <div class="btn-box">
                <button type="submit" class="my-btn">Sign me up</button>
            </div>
        </form>
    </div>
</body>
</html>
