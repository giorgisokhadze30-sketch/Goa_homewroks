<!-- 12) გამოიყენეთ text-decoration კუთვნილება სხვადასხვა ტექსტურ ელემენტზე:
•    h1 – underline
•    h2 – overline
•    h3 – blueviolet dashed line-through
•    em – wavy red underline
•    strong – double underline -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <h1>Hello world</h1><br>
    <h2>Hello world</h2><br>
    <h3>Hello world</h3><br>
    <em>Hello world</em><br><br><br>
    <strong>Hello world</strong>
    
</body>
</html>
