<!-- 2) შექმენით მსგავსი Forms-ი. (მხოლოდ სტრუქტურა და არა დიზაინი) -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        <label for="name">Enter your full name</label><br>
        <input type="text"  id="name" name="Enter your full name" required><br><br>

        <label for="">Enter your email</label><br>
        <input type="email" id="email" name="Enter your email" required><br><br>

        <label for="password">Enter your password</label><br>
        <input type="password" id="password" name="Enter your password" required><br><br>

        <label for="password2">Confirm your password</label><br>
        <input type="password" id="password2" name="Confirm your password" required><br><br><br>

        <label for="gender">Enter your gender</label><br>
        <select>>name="Enter your gender" id="gender">
            <option value="F">Female</option>
            <option value="M">Male</option>
            <option value="O">others</option>
        </select>
        
        

    </form>
</body>
</html>
